# GameProfile: WoW: Forever buff matrix (Classic-era rules). Rewritten 2026-09-15 from the TBC clone.
#
# Forever is "Classic continued", so the working assumption is Vanilla scoping:
#   party  = totems, auras, shouts, Blood Pact (5-man group; totems have a static radius)
#   raid   = cast buffs: Fortitude, Divine Spirit, Mark of the Wild, Arcane Intellect,
#            Shadow Protection, Paladin Blessings (one blessing per paladin, 1 h)
# Every entry carries `status`: confirmed (Blizzard/beta capture), reported (fan-site claim),
# assumed (Vanilla behaviour, nothing published for Forever). The analytics cards print these,
# so keep them honest. Sources: docs/research.md §1a.
# 2026-09-23: vetted against foreverchanges.pro, a fan site that publishes the Forever beta client's own tooltips
# (build 1.60.1.69913, from the client's data tables) beside Classic's. Its tooltips move entries from assumed to
# reported; our own captures and Blizzard's posts stay the only `confirmed`. Removed after that pass: Sanctity Aura
# (no longer in the Retribution tree) and Tranquil Air Totem (absent from the Forever shaman spellbook).
# Leader of the Pack and Moonkin Aura are one family now (both tooltips say "exclusive with" the other).
# Not tracked on purpose: the other resistance totems, paladin resistance auras and Aspect of the Wild — raid-wide in
# Forever but encounter-specific, so they would only add "missing" noise to every card.
#
# scope:    party | raid | class | self   (only `party` drives grouping)
# kind:     aura | proc
# stacking: unique | stack
# slot:     one provider can only bring one buff per slot at a time (shaman totems by element).
#           Coverage and the solver pick the best totem per element for each group.
# choices:  raid-scope only; a list of things each provider fills one of, in priority order (blessings).
# family:   stacking family (see the bottom of this file); strength: multiplier on the family's value (default 1).
buffs:
  # ---------------------------------------------------------------- shaman totems (party, static radius)
  - id: windfury_totem
    family: windfury_totem
    icon: {abbr: WF, colour: "#5C9BFF", art: spell_nature_windfury}
    name: Windfury Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_air
    status: reported
    note: >-
      Air totem, party. Forever: main-hand hits only, 20% for 1 extra attack with 246 AP (Classic 315), 5 min; the
      tooltip's radius reads "?". Windfury Weapon on a shaman's main hand cancels their own benefit from the totem.
      Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: grace_of_air
    family: grace_of_air
    icon: {abbr: GoA, colour: "#9FD8F5", art: spell_nature_invisibilitytotem}
    name: Grace of Air Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_air
    status: reported
    note: >-
      Air totem (agility), party, 30 yd, 5 min. Forever raised it to 89 Agility (Classic 77) while Strength of Earth
      fell, so it wins the air slot more often in hunter/rogue/feral groups. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: strength_of_earth
    family: strength_of_earth
    icon: {abbr: SoE, colour: "#B0855B", art: spell_nature_earthbindtotem}
    name: Strength of Earth Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_earth
    status: reported
    note: >-
      Earth totem, party, 30 yd, 5 min. Forever: 53 Strength (Classic 77) — about a third weaker.
      Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: stoneskin
    family: stoneskin
    icon: {abbr: SS, colour: "#8D8D8D", art: spell_nature_stoneskintotem}
    name: Stoneskin Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_earth
    status: reported
    note: >-
      Earth totem, party, 30 yd, 5 min: Physical damage taken −30 (Classic: melee only). Loses the slot to
      Strength of Earth unless the group has no melee. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: mana_spring
    family: mana_spring
    icon: {abbr: MSp, colour: "#4FB3E8", art: spell_nature_manaregentotem}
    name: Mana Spring Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_water
    status: reported
    note: >-
      Water totem, group, 30 yd, 5 min (Classic 1 min): 10 mana every 2 s; Restorative Totems +25%.
      Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: mana_tide
    family: mana_tide
    icon: {abbr: MT, colour: "#2F8FD6", art: spell_frost_summonwaterelemental}
    name: Mana Tide Totem
    providers: [Shaman:Restoration]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_water_cd
    status: reported
    note: >-
      Restoration talent, now tier 4 without Restorative Totems. Forever: 88 mana every 3 s for 12 s (Classic 170),
      30 yd. Cooldown totem, so it does not compete with Mana Spring for the slot. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: healing_stream
    family: healing_stream
    icon: {abbr: HSt, colour: "#7FD3C8", art: inv_spear_04}
    name: Healing Stream Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_water
    status: reported
    note: >-
      Water totem, group, 30 yd, 5 min: 11 health every 2 s (Classic 14); Restorative Totems now +50%. Usually loses
      the slot to Mana Spring. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: fire_resistance
    family: fire_resistance
    icon: {abbr: FR, colour: "#E06A3A", art: spell_fireresistancetotem_01}
    name: Fire Resistance Totem
    providers: [Shaman:*]
    scope: raid
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Forever: "party and raid members within 30 yards", +60 fire resistance, 5 min — raid-wide by radius, so one
      shaman covers it wherever they are grouped (it takes that shaman's fire totem). Encounter-specific (Onyxia).
      Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: flametongue_totem
    family: flametongue_totem
    icon: {abbr: FT, colour: "#F28B3C", art: spell_nature_guardianward}
    name: Flametongue Totem
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    slot: shaman_fire
    status: reported
    note: >-
      Fire totem, party, 30 yd: each main-hand hit deals 17–55 extra Fire damage. With Fire Resistance now raid-wide,
      this is the fire totem that matters for grouping (melee groups). Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  # ---------------------------------------------------------------- other party auras
  - id: trueshot_aura
    family: trueshot_aura
    icon: {abbr: TA, colour: "#8FBF5A", art: ability_trueshot}
    name: Trueshot Aura (+30 ranged AP)
    providers: [Hunter:Marksmanship]
    scope: party
    kind: aura
    stacking: unique
    status: confirmed
    note: "Beta capture: 'Increases the Ranged Attack Power of party members within 45 yards by 30' (MM row 4). Ranged-only now."

  - id: leader_of_the_pack
    family: leader_of_the_pack
    icon: {abbr: LotP, colour: "#FF7D0A", art: spell_nature_unyeildingstamina}
    name: Leader of the Pack (3% crit)
    providers: [Druid:Feral, Druid:Guardian]
    scope: party
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Feral talent, now tier 5. Forever: +3% critical strike chance (all crit, not just melee/ranged) for party
      members within 45 yd, "exclusive with Moonkin Aura" — same family as Moonkin. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: moonkin_aura
    family: leader_of_the_pack
    icon: {abbr: MA, colour: "#D7A6FF", art: spell_nature_moonglow}
    name: Moonkin Aura (3% crit)
    providers: [Druid:Balance]
    scope: party
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Moonkin Form, Forever: +3% critical strike chance (all crit, was spell crit) for party members within 45 yd
      (was 30), "exclusive with Leader of the Pack"; also doubles Omen of Clarity procs. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: battle_shout
    family: battle_shout
    icon: {abbr: BS, colour: "#C79C6E", art: ability_warrior_battleshout}
    name: Battle Shout
    providers: [Warrior:*]
    scope: party
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Party, 20 yd, 3 min. Forever: 139 melee attack power (Classic 232) — about 40% weaker; Improved Battle Shout
      is gone and Booming Voice only widens the radius. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: blood_pact
    family: blood_pact
    icon: {abbr: BP, colour: "#9482C9", art: spell_shadow_bloodboil}
    name: Blood Pact (imp)
    providers: [Warlock:*]
    scope: party
    kind: aura
    stacking: unique
    status: assumed
    note: >-
      Vanilla party-wide, needs an imp out. The Blood Pact spell itself isn't published for Forever (pet spells
      aren't in the client captures); Improved Imp no longer boosts it (foreverchanges.pro, beta 1.60.1).

  - id: devotion_aura
    family: devotion_aura
    icon: {abbr: Dev, colour: "#F5D76E", art: spell_holy_devotionaura}
    name: Devotion Aura
    providers: [Paladin:*]
    scope: party
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Party, 30 yd: +735 armor, same as Classic. With Sanctity Aura gone from Forever's Retribution tree, it is the
      paladin party aura that matters for grouping (one aura per paladin). Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: vampiric_embrace
    family: vampiric_embrace
    icon: {abbr: VE, colour: "#B39DDB", art: spell_shadow_unsummonbuilding}
    name: Vampiric Embrace (party heal)
    providers: [Priest:Shadow]
    scope: party
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Beta capture says the debuff is 30 s with a cooldown (foreverchanges.pro agrees: 30 s, 20% of Shadow damage as
      party healing; Improved Vampiric Embrace is gone). Small party heal, not a mana battery like TBC's Vampiric Touch.

  # ---------------------------------------------------------------- raid-wide cast buffs (coverage = enough providers)
  - id: fortitude
    family: fortitude
    icon: {abbr: Fort, colour: "#E6E6E6", art: spell_holy_wordfortitude}
    name: "Power Word: Fortitude"
    providers: [Priest:*]
    scope: raid
    kind: aura
    stacking: unique
    status: reported
    note: >-
      Prayer of Fortitude: "all party and raid members", +70 Stamina, 1 h — one cast covers the raid, so 1 priest is
      enough. Improved Power Word: Fortitude is gone. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  - id: divine_spirit
    family: divine_spirit
    icon: {abbr: Spirit, colour: "#C9D6FF", art: spell_holy_divinespirit}
    name: Divine Spirit
    providers: [Priest:*]
    scope: raid
    kind: aura
    stacking: unique
    status: confirmed
    note: >-
      Blizzard deep dive: Divine Spirit is baseline (was a Discipline talent), so any priest brings it. The client
      agrees: trained at 30, +40 Spirit for 1 h; Prayer of Spirit reaches all party and raid members.

  - id: shadow_protection
    family: shadow_protection
    icon: {abbr: SP, colour: "#7E6AA8", art: spell_shadow_antishadow}
    name: Shadow Protection
    providers: [Priest:*]
    scope: raid
    kind: aura
    stacking: unique
    status: reported
    note: "Prayer of Shadow Protection: all party and raid members, +60 Shadow resistance, 20 min. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23."

  - id: mark_of_the_wild
    family: mark_of_the_wild
    icon: {abbr: MotW, colour: "#FF7D0A", art: spell_nature_regeneration}
    name: Mark of the Wild (improved)
    providers: [Druid:*]
    scope: raid
    kind: aura
    stacking: unique
    status: confirmed
    note: >-
      Blizzard deep dive: Improved Mark of the Wild is baseline; the client agrees (385 armor, +16 attributes, +27
      resistances, 1 h — the old talent's numbers, and the talent is gone). Gift of the Wild reaches all party and raid members.

  - id: arcane_intellect
    family: arcane_intellect
    icon: {abbr: AI, colour: "#69CCF0", art: spell_holy_magicalsentry}
    name: Arcane Intellect
    providers: [Mage:*]
    scope: raid
    kind: aura
    stacking: unique
    status: reported
    note: "Arcane Brilliance: the target's party and raid, +31 Intellect, 1 h. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23."

  - id: blessings
    family: blessings
    icon: {abbr: Bless, colour: "#F58CBA", art: spell_magic_greaterblessingofkings}
    name: Paladin Blessings
    providers: [Paladin:*]
    scope: raid
    kind: aura
    stacking: stack
    status: reported
    choices: [Kings, Might, Wisdom, Salvation, Light]
    wanted: 4
    note: >-
      Each paladin keeps one Greater Blessing per class on the raid, 1 h (Classic 15 min); Kings is trained at 20,
      no talent. Forever numbers: Might 133 AP (Classic 185), Wisdom 40 mana/5 s (Classic 33); Improved Might,
      Improved Wisdom and Blessing of Sanctuary are gone. Priority: Kings, then Might for physical classes, Wisdom
      for casters/healers, Salvation for threat. 4 paladins = full coverage. Source: foreverchanges.pro (beta client 1.60.1.69913 tooltips), vetted 2026-09-23.

  # ---------------------------------------------------------------- log signals that must not drive grouping
  - id: windfury_attack
    family: windfury_attack
    name: Windfury Attack
    providers: []
    scope: party
    kind: proc
    stacking: unique
    status: assumed

# ---------------------------------------------------------------- stacking families
# Buffs in one family don't stack on a target: the strongest present one counts (strength × the family's value).
# `value` = who benefits and how much (all | physical | spell | mana | melee | ranged | healer | tank | spec:<Name>).
# Guilds override any of this in guild.yaml (`families:` / `buffs:`) as Forever facts come in; the Auras page edits it.
families:
  - id: windfury_totem
    name: Windfury (extra attacks)
    status: reported
    # 246 AP per proc (Classic 315); an Enhancement shaman with Windfury Weapon gets nothing from their own totem
    value: {melee: 9, tank: 3, "spec:Enhancement": 0, "spec:Feral": 4}
  - id: grace_of_air
    name: Agility
    status: reported
    # 89 Agility (Classic 77)
    value: {ranged: 6, "spec:Feral": 4, "spec:Combat": 3, "spec:Assassination": 3, "spec:Subtlety": 3}
  - id: strength_of_earth
    name: Strength
    status: reported
    # 53 Strength (Classic 77)
    value: {melee: 3.5, tank: 2}
  - id: stoneskin
    name: Physical damage reduction
    status: reported
    value: {tank: 2}
  - id: mana_spring
    name: Mana regen
    status: reported
    value: {mana: 3, healer: 4}
  - id: mana_tide
    name: Mana burst
    status: reported
    # 88 mana per tick (Classic 170)
    value: {healer: 3, mana: 1}
  - id: healing_stream
    name: Health regen
    status: reported
    value: {tank: 2, melee: 1}
  - id: fire_resistance
    name: Fire Resistance Totem
    status: reported
    value: {tank: 1}
  - id: flametongue_totem
    name: Fire damage on melee hits
    status: reported
    value: {melee: 2, tank: 1, "spec:Enhancement": 0}
  - id: trueshot_aura
    name: Ranged attack power
    status: confirmed
    value: {ranged: 3, "spec:Elemental": 0, "spec:Balance": 0, "spec:Shadow": 0, "spec:Fire": 0, "spec:Frost": 0, "spec:Arcane": 0, "spec:Affliction": 0, "spec:Destruction": 0, "spec:Demonology": 0}
  - id: leader_of_the_pack
    name: Critical strike (party)
    status: reported
    # Leader of the Pack and Moonkin Aura: +3% crit of every kind, and "exclusive with" each other
    value: {physical: 4, spell: 4, tank: 2, healer: 1}
  - id: battle_shout
    name: Attack power
    status: reported
    # 139 AP (Classic 232)
    value: {physical: 2.5, tank: 1.5}
  - id: blood_pact
    name: Stamina (Blood Pact)
    status: assumed
    value: {all: 1, tank: 2}
  - id: devotion_aura
    name: Armor (Devotion Aura)
    status: reported
    value: {tank: 2, melee: 1}
  - id: vampiric_embrace
    name: Party heal
    status: reported
    value: {melee: 1, ranged: 1, tank: 1}
  - id: fortitude
    name: Stamina (Fortitude)
    status: reported
    value: {all: 3}
  - id: divine_spirit
    name: Spirit
    status: confirmed
    value: {mana: 2, healer: 3}
  - id: shadow_protection
    name: Shadow resistance
    status: reported
    value: {all: 1}
  - id: mark_of_the_wild
    name: All stats
    status: confirmed
    value: {all: 3}
  - id: arcane_intellect
    name: Intellect
    status: reported
    value: {mana: 3, healer: 2}
  - id: blessings
    name: Blessings
    status: reported
    value: {all: 3}
  - id: windfury_attack
    name: Windfury Attack
    status: assumed
    value: {}
