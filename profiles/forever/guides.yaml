# The leveling-guide tool's game data (design §5.55): a member unlocks their own RestedXP guide on the Me page and gets a
# companion addon, an offline route explorer and readable text. Everything version-specific about the format is here —
# the zone-id table (uiMapID → name), the continent rects the addon's world coordinates project onto (HereBeDragons,
# Classic), the dungeon tags the guides use, and where the free starter guides sit inside the RXPGuides addon zip.
format: rxp
addon_folder: forever          # Guides/<folder>/*.lua inside the RXPGuides addon zip (the free 1–20 guides)
addon_interface: "16001, 11509"  # the companion addon's .toc Interface line (copy RXPGuides' own when WoW marks it incompatible)
continents:                     # uiMapID: {index used by the explorer, width, height, left, top in world yards}
  1415: {name: Eastern Kingdoms, index: 0, width: 40741.1796875, height: 27149.6875, left: 18171.970703125, top: 11176.34375}
  1414: {name: Kalimdor, index: 1, width: 36799.810546875, height: 24533.2001953125, left: 17066.599609375, top: 12799.900390625}
