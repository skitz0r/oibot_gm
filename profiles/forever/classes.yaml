# GameProfile: The Burning Crusade (Anniversary). Classes, specs and the
# attributes the buff matrix keys on.
#
# role:   tank | healer | melee | ranged
# dmg:    physical | spell | none        (what kind of damage buffs help)
# mana:   whether the spec cares about mana regen buffs
# token:  T6 armor token group
profile: forever
raid_sizes: [10, 20, 40]

token_groups:
  Conqueror: [Paladin, Priest, Warlock]
  Protector: [Warrior, Hunter, Shaman]
  Vanquisher: [Rogue, Mage, Druid]

armor:
  Warrior: plate
  Paladin: plate
  Hunter: mail
  Shaman: mail
  Rogue: leather
  Druid: leather
  Priest: cloth
  Mage: cloth
  Warlock: cloth

classes:
  Warrior:
    Arms:        {role: melee,  dmg: physical, mana: false}
    Fury:        {role: melee,  dmg: physical, mana: false}
    Protection:  {role: tank,   dmg: physical, mana: false}
  Paladin:
    Holy:        {role: healer, dmg: none,     mana: true}
    Protection:  {role: tank,   dmg: spell,    mana: true}
    Retribution: {role: melee,  dmg: physical, mana: true}
  Hunter:
    BeastMastery: {role: ranged, dmg: physical, mana: true}
    Marksmanship: {role: ranged, dmg: physical, mana: true}
    Survival:     {role: ranged, dmg: physical, mana: true}
  Rogue:
    Combat:       {role: melee, dmg: physical, mana: false}
    Assassination: {role: melee, dmg: physical, mana: false}
    Subtlety:     {role: melee, dmg: physical, mana: false}
  Priest:
    Holy:        {role: healer, dmg: none,  mana: true}
    Discipline:  {role: healer, dmg: none,  mana: true}
    Shadow:      {role: ranged, dmg: spell, mana: true}
  Shaman:
    Elemental:   {role: ranged, dmg: spell,    mana: true}
    Enhancement: {role: melee,  dmg: physical, mana: true}
    Restoration: {role: healer, dmg: none,     mana: true}
  Mage:
    Arcane:      {role: ranged, dmg: spell, mana: true}
    Fire:        {role: ranged, dmg: spell, mana: true}
    Frost:       {role: ranged, dmg: spell, mana: true}
  Warlock:
    Affliction:  {role: ranged, dmg: spell, mana: true}
    Destruction: {role: ranged, dmg: spell, mana: true}
    Demonology:  {role: ranged, dmg: spell, mana: true}
  Druid:
    Balance:     {role: ranged, dmg: spell,    mana: true}
    Feral:       {role: melee,  dmg: physical, mana: false}
    Guardian:    {role: tank,   dmg: physical, mana: false}
    Restoration: {role: healer, dmg: none,     mana: true}

# Aliases seen in external data (Raid-Helper spec labels, WCL, BisCouncil)
spec_aliases:
  "Beast Mastery": BeastMastery
  "Marksman": Marksmanship
  "Bear": Guardian
  "Cat": Feral
  "Warden": Guardian
  "Resto": Restoration
  "Prot": Protection
  "Ret": Retribution
  "Enh": Enhancement
  "Ele": Elemental
  "Disc": Discipline

# BisCouncil export ids (derived from the guild's Loot Summary export)
biscouncil:
  class_id: {2: Druid, 3: Hunter, 4: Mage, 5: Paladin, 6: Priest, 7: Rogue, 8: Shaman, 9: Warlock, 10: Warrior}
  role_id: {1: ranged, 2: melee, 3: healer, 4: tank}
  spec_id:
    6: [Druid, Balance]
    7: [Druid, Feral]
    8: [Druid, Guardian]
    9: [Druid, Restoration]
    10: [Hunter, BeastMastery]
    11: [Hunter, Marksmanship]
    12: [Hunter, Survival]
    13: [Mage, Arcane]
    16: [Paladin, Holy]
    17: [Paladin, Protection]
    18: [Paladin, Retribution]
    20: [Priest, Holy]
    21: [Priest, Shadow]
    23: [Rogue, Combat]
    25: [Shaman, Elemental]
    26: [Shaman, Enhancement]
    27: [Shaman, Restoration]
    28: [Warlock, Affliction]
    30: [Warlock, Destruction]
    32: [Warrior, Fury]

# Icon file names on Blizzard's render CDN (https://render.worldofwarcraft.com/us/icons/56/<name>.jpg) — the same
# files the Game Data API's media endpoints point at. The site proxies and caches them; badges are the fallback.
icons:
  classes:
    Warrior: classicon_warrior
    Paladin: classicon_paladin
    Hunter: classicon_hunter
    Rogue: classicon_rogue
    Priest: classicon_priest
    Shaman: classicon_shaman
    Mage: classicon_mage
    Warlock: classicon_warlock
    Druid: classicon_druid
  roles:
    tank: inv_shield_06
    healer: spell_holy_flashheal
    melee: ability_dualwield
    ranged: ability_hunter_snipershot
  specs:
    "Warrior:Arms": ability_warrior_savageblow
    "Warrior:Fury": ability_warrior_innerrage
    "Warrior:Protection": ability_warrior_defensivestance
    "Paladin:Holy": spell_holy_holybolt
    "Paladin:Protection": spell_holy_devotionaura
    "Paladin:Retribution": spell_holy_auraoflight
    "Hunter:BeastMastery": ability_hunter_beasttaming
    "Hunter:Marksmanship": ability_marksmanship
    "Hunter:Survival": ability_hunter_swiftstrike
    "Rogue:Assassination": ability_rogue_eviscerate
    "Rogue:Combat": ability_backstab
    "Rogue:Subtlety": ability_stealth
    "Priest:Discipline": spell_holy_wordfortitude
    "Priest:Holy": spell_holy_holybolt
    "Priest:Shadow": spell_shadow_shadowwordpain
    "Shaman:Elemental": spell_nature_lightning
    "Shaman:Enhancement": spell_nature_lightningshield
    "Shaman:Restoration": spell_nature_magicimmunity
    "Mage:Arcane": spell_holy_magicalsentry
    "Mage:Fire": spell_fire_firebolt02
    "Mage:Frost": spell_frost_frostbolt02
    "Warlock:Affliction": spell_shadow_deathcoil
    "Warlock:Demonology": spell_shadow_metamorphosis
    "Warlock:Destruction": spell_shadow_rainoffire
    "Druid:Balance": spell_nature_starfall
    "Druid:Feral": ability_druid_catform
    "Druid:Guardian": ability_racial_bearform
    "Druid:Restoration": spell_nature_healingtouch
