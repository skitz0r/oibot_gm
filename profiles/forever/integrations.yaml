# Integrations for WoW: Forever. The static namespace was probed live on 2026-11-11 (build 1.60.1_70399).
wcl_host: null
blizzard_namespace: static-forever-us   # item lookups (`oibot items …`) and the recipe list (scripts/import_recipes.py)
tmb_expansion_id: null
wowhead_item_url: "https://www.wowhead.com/forever/item={id}"   # the site's item links and the Discord loot item card (Wowhead adds the name itself; confirmed by the owner 2026-11-13)
# The Forever armory (armory link, spec §5/§9): no realms; {region} is filled from `region` (or a guild's own).
armory:
  region: us
  profile_namespace: "profile-forever-{region}"
  static_namespace: "static-forever-{region}"
  # The armory's playable-class ids → this profile's class keys (classes.yaml). An id missing here reads as no class.
  classes: {1: Warrior, 2: Paladin, 3: Hunter, 4: Rogue, 5: Priest, 7: Shaman, 8: Mage, 9: Warlock, 11: Druid}
  # The armory's ruleset ids → what kind of guild it is (shown on the owner's link screen).
  rulesets: {1: PvP, 2: Normal, 3: Roleplay, 15: Roleplay PvP}
# The auction houses (auction prices, spec §4.1/§8; probed live 2026-11-13, undocumented): read in the dynamic namespace,
# per ruleset (the armory guild page's ruleset id). Only a house named for the guild's faction is offered (never Blackwater).
auctions:
  dynamic_namespace: "dynamic-forever-{region}"
  factions: {Alliance: "Alliance Auction House", Horde: "Horde Auction House"}
  # Well-known stackables the owner's picker prices so a house can be matched against the game: Arcanite Bar, Dreamfoil, Runecloth.
  reference_items: [12360, 13463, 14047]
  # Item names for the price search: the Forever item pages (the static namespace above) lack most random-stat gear and
  # ammunition that IS listed (a 404), while the same ids are named in the Classic Era pages. Probed live 2026-11-14: of
  # 100 listed ids nothing named, 86 were named only here, 2 nowhere. Asked only after the version's own page says no.
  names_fallback_namespace: "static-classic1x-{region}"
  # Bargains (2026-11-15): another economy's prices to hold this one against — TradeSkillMaster's public Classic region
  # file (static CSV, no key; its terms name the public pricing files as the feature for automated reads). Read once a
  # day into out/auctions/reference/. `name` = what the card calls that economy, `source` = whose numbers they are.
  # Which Classic realms the region file blends is not documented: a mature economy's snapshot, not a history.
  reference:
    name: Classic
    source: TradeSkillMaster
    url: "https://public-data.tradeskillmaster.com/classic/{region}/region/items.csv"
  # The Movers card's item groups, by Blizzard's item class (the item page's `item_class.name`, read with the name).
  # Probed live 2026-11-14 over 620 movers: every one had a class. `reagents: true` = where a recipe's reagent goes when
  # its class is in no group (or not read yet). Anything else is "Other" (bags, quivers, pets, junk). Blizzard's Quest
  # class covers flagged quest items only: a tradeable item a quest merely asks for keeps its own class.
  groups:
    - {id: materials, name: Materials, classes: ["Trade Goods", "Reagent"], reagents: true}
    - {id: consumables, name: Consumables, classes: ["Consumable"]}
    - {id: gear, name: Gear, classes: ["Armor", "Weapon"]}
    - {id: recipes, name: Recipes, classes: ["Recipe"]}
    - {id: quest, name: Quest, classes: ["Quest"]}
