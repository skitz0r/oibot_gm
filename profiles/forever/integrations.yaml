# Integrations for WoW: Forever. The static namespace was probed live on 2026-11-11 (build 1.60.1_70399).
wcl_host: null
blizzard_namespace: static-forever-us   # item lookups (`oibot items …`) and the recipe list (scripts/import_recipes.py)
tmb_expansion_id: null
wowhead_item_url: "https://www.wowhead.com/forever/item={id}"   # the site's item links and the Discord loot item card (Wowhead adds the name itself; confirmed by the owner 2026-11-13)
# The Forever armory (armory link, spec §5/§9): no realms; {region} is filled from `region` (or a guild's own).
armory:
  region: us
  profile_namespace: "profile-forever-{region}"
  static_namespace: "static-forever-{region}"
  # The armory's playable-class ids → this profile's class keys (classes.yaml). An id missing here reads as no class.
  classes: {1: Warrior, 2: Paladin, 3: Hunter, 4: Rogue, 5: Priest, 7: Shaman, 8: Mage, 9: Warlock, 11: Druid}
  # The armory's ruleset ids → what kind of guild it is (shown on the owner's link screen).
  rulesets: {1: PvP, 2: Normal, 3: Roleplay, 15: Roleplay PvP}
# The auction houses (auction prices, spec §4.1/§8; probed live 2026-11-13, undocumented): read in the dynamic namespace,
# per ruleset (the armory guild page's ruleset id). Only a house named for the guild's faction is offered (never Blackwater).
auctions:
  dynamic_namespace: "dynamic-forever-{region}"
  factions: {Alliance: "Alliance Auction House", Horde: "Horde Auction House"}
  # Well-known stackables the owner's picker prices so a house can be matched against the game: Arcanite Bar, Dreamfoil, Runecloth.
  reference_items: [12360, 13463, 14047]
