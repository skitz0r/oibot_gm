    stacking: unique
    value: {spell: 3, healer: 2}

  - id: mana_tide
    icon: {abbr: MT, colour: "#4FB3E8"}
    name: Mana Tide / Mana Spring
    providers: [Shaman:Restoration]
    scope: party
    kind: aura
    stacking: unique
    value: {healer: 5, mana: 3}

  - id: ferocious_inspiration
    icon: {abbr: FI, colour: "#ABD473"}
    name: Ferocious Inspiration (3% dmg, stacks)
    providers: [Hunter:BeastMastery]
    scope: party
    kind: aura
    stacking: stack
    value: {physical: 4, spell: 4}

  - id: trueshot_aura
    icon: {abbr: TA, colour: "#8FBF5A"}
