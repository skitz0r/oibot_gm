# GameProfile: TBC party-scoped buff matrix.
#
# This is the file the group solver optimises against AND the file the
# WCL party-inference uses (scope/kind decide what counts as a party signal).
#
# scope:    party | raid | class | self   (only `party` matters for grouping)
# kind:     aura | proc                   (procs are ignored by inference)
# stacking: unique | stack                (unique: one provider per group is
#                                          enough; stack: each provider adds)
# value:    points per beneficiary, keyed by spec attribute. The highest
#           matching key applies; `spec:<Name>` overrides win. Keys:
#           all | physical | spell | mana | melee | ranged | healer | tank
# providers: specs that bring it. `Shaman:*` means any spec of the class.
#
# The numbers are a starting point for the T6 meta, not gospel. They are
# meant to be tuned against real WCL group layouts (shadow mode).
buffs:
  - id: windfury_totem
    icon: {abbr: WF, colour: "#5C9BFF"}
    name: Windfury Totem
    providers: [Shaman:Enhancement]
    scope: party
    kind: aura
    stacking: unique
    value: {melee: 10, tank: 3, "spec:Enhancement": 2, "spec:Feral": 4}
    note: Enh shaman drops it; other shamans could but are wanted elsewhere.

  - id: unleashed_rage
    icon: {abbr: UR, colour: "#C0392B"}
    name: Unleashed Rage (10% AP)
    providers: [Shaman:Enhancement]
    scope: party
    kind: aura
    stacking: unique
    value: {physical: 5, tank: 2}

  - id: bloodlust
    icon: {abbr: BL, colour: "#E5484D"}
    name: Bloodlust / Heroism
    providers: [Shaman:*]
    scope: party
    kind: aura
    stacking: unique
    value: {physical: 6, spell: 6, healer: 3, tank: 2}
    note: Party-wide in TBC, so one shaman per group is the classic layout.

  - id: totem_of_wrath
    icon: {abbr: ToW, colour: "#F0A030"}
    name: Totem of Wrath
    providers: [Shaman:Elemental]
    scope: party
    kind: aura
    stacking: unique
    value: {spell: 6}

  - id: wrath_of_air
