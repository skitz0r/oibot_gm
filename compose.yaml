# docker compose up -d        start the bot (reads .env)
# docker compose logs -f      follow
# docker compose down         stop
#
# State: ./out (mock-event JSON, reports, discord.log) and ./fixtures/25bg
# (real guild data, gitignored) are bind-mounted so nothing lives only in the
# container. When the SQLite store lands, add a litestream service here.
services:
  bot:
    build: .
    env_file: .env
    environment:
      - OIBOT_GUILD_DIR=${OIBOT_GUILD_DIR:-fixtures/25bg}
    volumes:
      - ./out:/app/out
      - ./fixtures/25bg:/app/fixtures/25bg
    restart: unless-stopped
