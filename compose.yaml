# docker compose up -d        start the bot (reads .env)
# docker compose logs -f      follow
# docker compose down         stop
#
# State: the private data repo (a sibling checkout, ../oibot_gm-data) is the
# native store; the bot commits to it and pushes. ./out holds reports/logs.
# Mount an SSH key or use a token remote so the container can push.
services:
  bot:
    build: .
    env_file: .env
    environment:
      - OIBOT_DATA_DIR=/data
      - OIBOT_GUILD_DIR=/data/25bg
    volumes:
      - ./out:/app/out
      - ${OIBOT_DATA_DIR:-../oibot_gm-data}:/data
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped
