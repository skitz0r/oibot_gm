[project]
name = "oibot-gm"
version = "0.0.1"
description = "oibot_GM — Guild Master assistant for WoW raiding guilds (offline prototype)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "ortools>=9.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "discord-py>=2.6",
    "pillow>=10.3",
]

[project.scripts]
oibot = "oibot_gm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oibot_gm"]

[tool.uv]
python-preference = "managed"

[dependency-groups]
dev = [
    "websockets>=17.1",
]
